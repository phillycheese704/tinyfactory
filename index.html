<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>🏭 Tiny Factory</title>
  <style>
    :root {
      --ink: #292929;
      --paper: #ffffff;
      --cream: #fffdf7;
      --yellow: #ffe28b;
      --stroke: 2px solid var(--ink);
      --hot-slot: clamp(21px, calc((100vw - 92px) / 11), 64px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: "Comic Sans MS", "Trebuchet MS", cursive, sans-serif; overscroll-behavior: none; }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:focus-visible { outline: 3px dashed #489acb; outline-offset: 3px; }
    .world { position: relative; min-height: 100vh; min-height: 100dvh; background: #fff; }
    .topbar { position: absolute; inset: 0 0 auto 0; height: 83px; display: flex; align-items: flex-start; justify-content: space-between; padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left)); gap: 10px; }
    .brand { margin: 4px 0 0; font-size: clamp(15px, 1.8vw, 19px); font-weight: 800; letter-spacing: -.6px; line-height: 1.2; white-space: nowrap; transform: rotate(-1deg); }
    .balance { position: absolute; left: 50%; top: max(20px, env(safe-area-inset-top)); transform: translateX(-50%) rotate(-1deg); border: var(--stroke); border-radius: 13px 11px 13px 10px; background: #fff; box-shadow: 2px 3px 0 var(--ink); padding: 8px 14px; min-width: 78px; font-size: 16px; font-weight: 800; text-align: center; white-space: nowrap; transition: opacity .2s, transform .2s; }
    body.shop-open .balance, body.bag-open .balance { opacity: 0; transform: translate(-50%, -10px) rotate(-1deg); pointer-events: none; }
    .shop-toggle { flex: 0 0 auto; width: 53px; height: 51px; border: var(--stroke); border-radius: 13px 11px 15px 10px; background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center; cursor: pointer; transform: rotate(3deg); transition: transform .17s ease, box-shadow .17s ease; }
    .shop-toggle:hover { transform: translateY(-2px) rotate(-2deg); box-shadow: 4px 5px 0 var(--ink); }
    .shop-toggle:active { transform: translate(2px, 2px) rotate(1deg); box-shadow: 1px 1px 0 var(--ink); }
    .shop-toggle svg { width: 33px; height: 33px; }
    .layer { position: fixed; z-index: 20; inset: 0; pointer-events: none; visibility: hidden; transition: visibility 0s linear .27s; }
    .layer.is-open { pointer-events: auto; visibility: visible; transition-delay: 0s; }
    .scrim { position: absolute; inset: 0; background: rgba(15, 17, 20, .55); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); opacity: 0; transition: opacity .26s ease; }
    .layer.is-open .scrim { opacity: 1; }
    .panel { position: absolute; left: 4%; top: 4%; top: 4dvh; width: 92%; height: 92%; height: 92dvh; min-height: 0; display: flex; flex-direction: column; overflow: auto; background: var(--cream); border: 2.5px solid var(--ink); border-radius: 18px 14px 21px 15px / 17px 20px 14px 17px; box-shadow: 5px 6px 0 rgba(0,0,0,.45); opacity: 0; transform: translateY(17px) scale(.965); transition: opacity .25s ease, transform .3s cubic-bezier(.2, .8, .25, 1); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .layer.is-open .panel { opacity: 1; transform: translateY(0) scale(1); }
    .panel-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: clamp(18px,3vw,32px) clamp(20px,3.5vw,48px) 10px; }
    .panel-heading { margin: 0; font-size: clamp(26px,3vw,36px); font-weight: 900; letter-spacing: -1.3px; transform: rotate(-1deg); }
    .panel-subtitle { display: inline-block; margin-top: 9px; font-size: 14px; font-weight: 800; border: 2px solid var(--ink); border-radius: 10px 12px 8px 11px; background: #fff; padding: 5px 12px; }
    .close { flex: 0 0 auto; width: 44px; height: 44px; background: #fff; border: 2px solid #dd4141; border-radius: 11px 9px 12px 10px; color: #e03434; font: 900 27px/1 sans-serif; display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .15s; }
    .close:hover { background: #ffeded; transform: rotate(5deg); }
    .items { padding: 28px clamp(20px,3.5vw,48px) 46px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-content: start; gap: clamp(14px, 2.2vw, 26px); }
    .item { border: 2.5px solid var(--ink); border-radius: 16px 12px 19px 13px / 13px 18px 13px 16px; box-shadow: 3px 4px 0 var(--ink); background: white; min-height: 180px; padding: 18px; text-align: left; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
    .item:hover { transform: translateY(-3px) rotate(-.5deg); box-shadow: 4px 6px 0 var(--ink); background: #fffaf0; }
    .item:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
    .item-art { width: 70px; height: 65px; border: 2px dashed #a8a8a8; border-radius: 11px 13px 10px 12px; background: #dff1ff; display: grid; place-items: center; }
    .item-art.conveyor { background: #e1f5e8; }
    .item-art.extractor { background: #f3e5fc; }
    .item-art svg { width: 58px; height: 53px; }
    .item-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center; width: 100%; margin-top: auto; padding-top: 17px; }
    .item-name { font-size: 20px; font-weight: 900; letter-spacing: -.5px; }
    .price { font-size: 15px; font-weight: 900; background: #fff2c3; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 10px 8px 11px 9px; white-space: nowrap; }

    /* Fixed, ten-slot inventory bar. Nine storage slots and a backpack button. */
    .hotbar-wrap { position: fixed; z-index: 5; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 12px); padding: 7px; border: 2px solid var(--ink); border-radius: 16px 14px 17px 12px; background: #fffdf7; box-shadow: 3px 4px 0 var(--ink); }
    body.bag-open .hotbar-wrap { z-index: 40; }
    .hotbar { display: grid; grid-template-columns: repeat(11, var(--hot-slot)); gap: clamp(3px, .65vw, 6px); align-items: center; }
    .storage-slot, .bag-toggle { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 1; padding: 0; flex: 0 0 auto; border: 2px solid #575757; border-radius: 10px 8px 11px 9px; background: #fff; cursor: pointer; transition: background .12s, border-color .12s, transform .12s; }
    .storage-slot { touch-action: none; user-select: none; -webkit-user-select: none; }
    .storage-slot.has-item { background: #fff9e9; }
    .storage-slot.is-selected { border-color: #1b7eb8; background: #dcefff; outline: 2px solid #1b7eb8; outline-offset: 1px; }
    .slot-label, .tool-label { position: absolute; bottom: calc(100% + 11px); left: 50%; transform: translateX(-50%); z-index: 8; pointer-events: none; background: #fffef5; border: 1.5px solid var(--ink); border-radius: 8px 7px 9px 6px; box-shadow: 2px 2px 0 var(--ink); padding: 4px 7px; font-size: clamp(10px, 1.4vw, 13px); font-weight: 800; white-space: nowrap; }
    .storage-slot.drag-over { background: #dcf6df; border-color: #279354; transform: scale(1.06); }
    .storage-slot.drag-origin { opacity: .4; }
    .slot-icon { width: 78%; height: 78%; pointer-events: none; }
    .slot-number { position: absolute; left: 3px; top: 1px; font-size: clamp(8px, 1.1vw, 10px); font-weight: 900; color: #7b7b7b; line-height: 1; pointer-events: none; }
    .bag-toggle { border-color: #292929; background: #ffe28b; }
    .delete-toggle { border-color: #9d4040; background: #ffeaea; }
    .delete-toggle[aria-pressed="true"] { border-color: #dc3b3b; outline: 2px solid #dc3b3b; background: #ffcccc; }
    .delete-toggle svg { width: 65%; height: 65%; }
    .bag-toggle[aria-expanded="true"] { background: #ffd26a; outline: 2px solid #f1ba37; }
    .bag-toggle svg { width: 68%; height: 68%; }
    .backpack-layer { z-index: 25; }
    .backpack-panel { bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--hot-slot) + 39px); height: auto; top: max(16px, 3dvh); overflow: auto; }
    .bag-grid { display: grid; grid-template-columns: repeat(6, clamp(36px, 8.4vw, 70px)); gap: clamp(5px, 1.1vw, 9px); align-content: start; justify-content: center; padding: 12px 12px 22px; margin: auto 0; }
    .bag-grid .storage-slot { width: 100%; }
    .bag-grid .slot-icon { width: 78%; height: 78%; }
    .drag-ghost { position: fixed; z-index: 200; pointer-events: none; display: grid; place-items: center; width: 66px; height: 66px; border: 2px solid var(--ink); border-radius: 12px; background: #fff1c8; box-shadow: 3px 4px 0 rgba(0,0,0,.3); opacity: .94; transform: translate(-50%,-50%) rotate(-7deg); }
    .drag-ghost svg { width: 80%; height: 80%; }
    /* The board uses the whole safe rectangle, not a letterboxed 16x16 square.
       The number of square tiles adapts to the device, keeping installed machines visible. */
    .factory-grid { position: absolute; left: 0; top: 0; width: 0; height: 0; display: grid; background: transparent; border: 2px solid transparent; border-radius: 5px; overflow: hidden; pointer-events: none; }
    body.has-place-tool .factory-grid, body.dragging-to-grid .factory-grid { background: #fefefe; border-color: #797979; box-shadow: 3px 3px 0 #d8d8d8; pointer-events: auto; }
    body.delete-active .factory-grid { pointer-events: auto; }
    .grid-cell { min-width: 0; min-height: 0; padding: 0; border: 0; background: transparent; display: grid; place-items: center; cursor: crosshair; touch-action: manipulation; }
    body.has-place-tool .grid-cell, body.dragging-to-grid .grid-cell { border-right: 1px dashed #dedede; border-bottom: 1px dashed #dedede; }
    body.has-place-tool .grid-cell.end-col, body.dragging-to-grid .grid-cell.end-col { border-right: 0; }
    body.has-place-tool .grid-cell.end-row, body.dragging-to-grid .grid-cell.end-row { border-bottom: 0; }
    .grid-cell:focus-visible { outline: 2px solid #1b7eb8; outline-offset: -2px; }
    .grid-cell.occupied { background: #fff3d7; border-radius: 4px; box-shadow: inset 0 0 0 1px #e6d7af; }
    .grid-cell .slot-icon { width: 94%; height: 94%; }
    body.has-place-tool .grid-cell:not(.occupied):hover, body.dragging-to-grid .grid-cell:not(.occupied):hover, .grid-cell.place-over { background: #def6e5; box-shadow: inset 0 0 0 2px #3b9460; }
    body.delete-active .grid-cell.occupied:hover { background: #ffdede; box-shadow: inset 0 0 0 2px #d84141; }
    .toast { position: fixed; bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--hot-slot) + 44px); left: 50%; transform: translate(-50%, 8px); z-index: 80; opacity: 0; pointer-events: none; background: #fff8d6; border: var(--stroke); border-radius: 12px 9px 13px 10px; box-shadow: 3px 4px 0 var(--ink); padding: 10px 20px; font-size: 15px; font-weight: 800; white-space: nowrap; transition: opacity .18s, transform .18s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 850px) {
      .items { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 580px) {
      .topbar { padding-top: max(16px, env(safe-area-inset-top)); }
      .brand { font-size: 15px; }
      .balance { top: max(70px, calc(env(safe-area-inset-top) + 54px)); font-size: 14px; }
      .shop-toggle { width: 49px; height: 47px; }
      .panel { border-radius: 14px; }
      .panel-head { padding: 17px 18px 0; }
      .panel-heading { font-size: 26px; }
      .items { padding: 20px 18px 34px; grid-template-columns: 1fr; }
      .item { min-height: 126px; }
      .item-art { width: 60px; height: 52px; }
      .item-art svg { width: 50px; height: 44px; }
      .hotbar-wrap { padding: 5px; border-width: 1.5px; }
      .storage-slot, .bag-toggle { border-width: 1.5px; border-radius: 7px; }
      .backpack-panel { bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--hot-slot) + 28px); }
      .bag-grid { padding-top: 7px; }
    }
    @media (max-height: 530px) {
      .bag-grid { margin: 0; }
      .backpack-panel { top: 8px; }
      .bag-grid .storage-slot { aspect-ratio: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- Reusable hand-drawn icons for shop and inventory. -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden">
    <symbol id="icon-dropper" viewBox="0 0 64 56"><g fill="none" stroke="#292929" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11h27v12H19zM25 11V6h15v5M32 23v15"/><path d="M26 39l6 8 6-8"/><path d="M16 24v7m32-10v12"/><path d="M18 49h29" stroke-dasharray="3 5"/></g></symbol>
    <symbol id="icon-conveyor" viewBox="0 0 64 56"><g fill="none" stroke="#292929" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 25Q9 19 16 19h31q8 0 8 7v6q0 7-8 7H16q-7 0-7-7z"/><circle cx="17" cy="29" r="4"/><circle cx="31" cy="29" r="4"/><circle cx="46" cy="29" r="4"/><path d="M18 40v7m28-7v7M15 47h37M22 12h18m-4-4 5 4-5 4"/></g></symbol>
    <symbol id="icon-extractor" viewBox="0 0 64 56"><g fill="none" stroke="#292929" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h28l4 11-4 9H18l-4-9zM24 10V5h16v5M23 30v9m18-9v9M21 39h22"/><path d="M27 40l-6 8h22l-6-8M29 21l3 5 3-5M11 32l-4 5m46-5 4 5"/></g></symbol>
    <symbol id="icon-delete" viewBox="0 0 64 64"><g fill="none" stroke="#8f3030" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 19h32M25 19v-6h14v6M20 23l3 29h18l3-29M29 30v15m7-15v15"/></g></symbol>
    <symbol id="icon-backpack" viewBox="0 0 64 64"><g fill="none" stroke="#292929" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"><path d="M23 18v-6c0-11 18-11 18 0v6M18 24V17c0-5 6-8 14-8s14 3 14 8v7"/><rect x="14" y="20" width="36" height="37" rx="9" fill="#fff9e4"/><path d="M20 39h24v15H20zM21 32h22M9 29v18m46-18v18"/><path d="M28 44h8"/></g></symbol>
  </svg>

  <main class="world" id="world">
    <header class="topbar">
      <h1 class="brand">🏭Tiny Factory</h1>
      <div class="balance" id="balance" aria-label="Money">$0</div>
      <button type="button" class="shop-toggle" id="shopToggle" aria-label="Open shop" aria-haspopup="dialog" aria-controls="shopPanel" aria-expanded="false" title="Shop">
        <svg viewBox="0 0 64 64" fill="none" stroke="#292929" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11h7l7 31h29l6-23H18"/><path d="M23 29h30M31 20l2 21m11-21-2 21M21 46h30"/><path d="M29 54a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM46 54a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
      </button>
    </header>
    <div class="factory-grid" id="factoryGrid" role="group" aria-label="Factory placement grid"></div>
  </main>

  <nav class="hotbar-wrap" aria-label="Inventory hotbar">
    <div class="hotbar" id="hotbar">
      <button type="button" class="bag-toggle" id="bagToggle" aria-label="Open backpack" aria-controls="backpackPanel" aria-expanded="false" title="Backpack"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-backpack"/></svg></button>
      <button type="button" class="bag-toggle delete-toggle" id="deleteToggle" aria-label="Select delete tool" aria-pressed="false" title="Delete placed item"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-delete"/></svg></button>
    </div>
  </nav>

  <div class="layer shop-layer" id="shopLayer" aria-hidden="true">
    <div class="scrim" id="shopScrim"></div>
    <section class="panel shop-panel" id="shopPanel" role="dialog" aria-modal="true" aria-label="Shop">
      <div class="panel-head">
        <div><h2 class="panel-heading">Shop</h2><div class="panel-subtitle" id="shopMoney">$0</div></div>
        <button type="button" id="closeShop" class="close" aria-label="Close shop">×</button>
      </div>
      <div class="items">
        <button type="button" class="item" id="buyDropper">
          <span class="item-art"><svg viewBox="0 0 64 56" aria-hidden="true"><use href="#icon-dropper"/></svg></span>
          <span class="item-bottom"><span class="item-name">Dropper</span><span class="price" id="dropperPrice">FREE</span></span>
        </button>
        <button type="button" class="item" id="buyConveyor">
          <span class="item-art conveyor"><svg viewBox="0 0 64 56" aria-hidden="true"><use href="#icon-conveyor"/></svg></span>
          <span class="item-bottom"><span class="item-name">Conveyor</span><span class="price" id="conveyorPrice">FREE</span></span>
        </button>
        <button type="button" class="item" id="buyExtractor">
          <span class="item-art extractor"><svg viewBox="0 0 64 56" aria-hidden="true"><use href="#icon-extractor"/></svg></span>
          <span class="item-bottom"><span class="item-name">Extractor</span><span class="price" id="extractorPrice">FREE</span></span>
        </button>
      </div>
    </section>
  </div>

  <div class="layer backpack-layer" id="backpackLayer" aria-hidden="true">
    <div class="scrim" id="backpackScrim"></div>
    <section class="panel backpack-panel" id="backpackPanel" role="dialog" aria-label="Backpack" aria-modal="false">
      <div class="panel-head">
        <div><h2 class="panel-heading">Backpack</h2><div class="panel-subtitle" id="bagCount">0/36</div></div>
        <button type="button" id="closeBackpack" class="close" aria-label="Close backpack">×</button>
      </div>
      <div class="bag-grid" id="bagGrid" aria-label="36 backpack slots"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const HOTBAR_SIZE = 9;
    const BACKPACK_SIZE = 36;
    const MIN_GRID_SIDE = 16;
    // Stable row/column positions survive viewport and iPad orientation changes.
    const placed = new Map();
    let gridCols = MIN_GRID_SIDE;
    let gridRows = MIN_GRID_SIDE;
    const cellKey = index => `${Math.floor(index / gridCols)},${index % gridCols}`;
    const MAX_PRICE = 999000000000000000n; // 999Qa
    const inventory = {
      hotbar: Array(HOTBAR_SIZE).fill(null),
      backpack: Array(BACKPACK_SIZE).fill(null)
    };
    let money = 0n; // Currency earning/spending will be added with factory gameplay.
    const prices = { Dropper: 0n, Conveyor: 0n, Extractor: 0n };
    let selected = null; // Inventory source, used while the backpack is open.
    let selectedHotbar = null; // Item chosen for placement on the factory grid.
    let deleteActive = false;
    let dragging = null;
    let toastTimer;

    // Use every available row and column of square tiles, while respecting the
    // actual header, money display, hotbar labels and iPad Safari safe area.
    function fitFactoryGrid() {
      const header = document.querySelector('.topbar').getBoundingClientRect();
      const balance = $('balance').getBoundingClientRect();
      const hotbar = document.querySelector('.hotbar-wrap').getBoundingClientRect();
      const viewportWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const viewportBottom = window.visualViewport ? window.visualViewport.height + window.visualViewport.offsetTop : window.innerHeight;
      const top = Math.max(header.bottom, balance.bottom) + 8;
      const bottom = Math.min(viewportBottom, hotbar.top - 34);
      const usableWidth = Math.max(0, Math.min(viewportWidth, window.innerWidth) - 16);
      const usableHeight = Math.max(0, bottom - top);
      // Start with at least 16 tiles along the shorter usable dimension, then
      // extend the longer dimension rather than leaving huge white sidebars.
      const largestTile = Math.max(1, Math.min(usableWidth, usableHeight) / MIN_GRID_SIDE);
      // Add another column rather than wasting almost a tile of space at the edge.
      const cols = Math.max(1, Math.ceil(usableWidth / largestTile));
      const tile = usableWidth / cols;
      const rows = Math.max(1, Math.floor(usableHeight / tile));
      const grid = $('factoryGrid');
      grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
      grid.style.width = cols * tile + 'px';
      grid.style.height = rows * tile + 'px';
      grid.style.left = Math.max(0, Math.floor((window.innerWidth - cols * tile) / 2)) + 'px';
      grid.style.top = top + Math.floor((usableHeight - rows * tile) / 2) + 'px';
      if (cols !== gridCols || rows !== gridRows || grid.childElementCount !== cols * rows) {
        gridCols = cols;
        gridRows = rows;
        buildGrid();
      }
    }
    window.addEventListener('resize', fitFactoryGrid);
    window.visualViewport?.addEventListener('resize', fitFactoryGrid);
    window.visualViewport?.addEventListener('scroll', fitFactoryGrid);
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitFactoryGrid).observe(document.querySelector('.hotbar-wrap'));

    function iconFor(item) { return `<svg class="slot-icon" viewBox="0 0 64 56" aria-hidden="true"><use href="#icon-${item.toLowerCase()}"></use></svg>`; }
    function formatAmount(value) {
      const units = [[1000000000000000n, 'Qa'], [1000000000000n, 'T'], [1000000000n, 'B'], [1000000n, 'M'], [1000n, 'K']];
      for (const [size, unit] of units) {
        if (value >= size) {
          const whole = value / size;
          const decimal = (value % size) * 10n / size;
          return `${whole}${decimal > 0n && whole < 100n ? '.' + decimal : ''}${unit}`;
        }
      }
      return value.toString();
    }
    function formatPrice(value) { return value === 0n ? 'FREE' : '$' + formatAmount(value); }
    function updateMoney() {
      $('balance').textContent = '$' + formatAmount(money);
      $('shopMoney').textContent = '$' + formatAmount(money);
    }
    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1450);
    }

    // Create inventory buttons once so pointer capture works reliably on iPad Safari.
    function createSlot(zone, index) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'storage-slot';
      button.dataset.zone = zone;
      button.dataset.index = index;
      button.addEventListener('pointerdown', startPointer);
      button.addEventListener('click', event => {
        // Pointer taps on filled slots are handled on pointerup; keyboard clicks land here.
        if (event.detail === 0 || (!inventory[zone][index] && selected)) tapSlot({ zone, index });
      });
      return button;
    }
    const bagToggle = $('bagToggle');
    for (let i = 0; i < HOTBAR_SIZE; i++) $('hotbar').insertBefore(createSlot('hotbar', i), bagToggle);
    for (let i = 0; i < BACKPACK_SIZE; i++) $('bagGrid').appendChild(createSlot('backpack', i));

    // A responsive number of real buttons gives iPad touch targets and keyboard
    // placement even in landscape. Saved tile positions use row/column keys.
    function buildGrid() {
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < gridCols * gridRows; index++) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'grid-cell';
        if (index % gridCols === gridCols - 1) cell.classList.add('end-col');
        if (Math.floor(index / gridCols) === gridRows - 1) cell.classList.add('end-row');
        cell.dataset.cell = index;
        cell.tabIndex = selectedHotbar !== null || deleteActive ? 0 : -1;
        cell.addEventListener('click', () => useGridCell(index));
        fragment.appendChild(cell);
      }
      $('factoryGrid').replaceChildren(fragment);
      renderGrid();
    }
    function renderGrid() {
      $('factoryGrid').querySelectorAll('.grid-cell').forEach((cell, index) => {
        const item = placed.get(cellKey(index));
        cell.innerHTML = item ? iconFor(item) : '';
        cell.classList.toggle('occupied', !!item);
        cell.setAttribute('aria-label', `Row ${Math.floor(index / gridCols) + 1}, column ${index % gridCols + 1}: ${item || 'empty'}`);
        cell.title = item || 'Empty factory tile';
      });
    }
    function placeFromHotbar(index, hotbarIndex) {
      if (placed.has(cellKey(index)) || !inventory.hotbar[hotbarIndex]) return;
      placed.set(cellKey(index), inventory.hotbar[hotbarIndex]);
      inventory.hotbar[hotbarIndex] = null;
      selectedHotbar = null;
      deleteActive = false;
      renderGrid();
      renderInventory();
    }
    function useGridCell(index) {
      if ($('shopLayer').classList.contains('is-open') || $('backpackLayer').classList.contains('is-open')) return;
      if (deleteActive) {
        if (placed.delete(cellKey(index))) renderGrid();
      } else if (selectedHotbar !== null) {
        placeFromHotbar(index, selectedHotbar);
      }
    }

    function renderInventory() {
      document.querySelectorAll('.storage-slot').forEach(button => {
        const zone = button.dataset.zone;
        const index = Number(button.dataset.index);
        const item = inventory[zone][index];
        button.classList.toggle('has-item', !!item);
        const isActive = zone === 'hotbar' && selectedHotbar === index && !deleteActive;
        button.classList.toggle('is-selected', isActive || !!selected && selected.zone === zone && selected.index === index);
        button.innerHTML = `${item ? iconFor(item) : ''}${zone === 'hotbar' ? `<span class="slot-number">${index + 1}</span>` : ''}${isActive && item ? `<span class="slot-label">${item}</span>` : ''}`;
        button.setAttribute('aria-label', `${zone === 'hotbar' ? 'Hotbar' : 'Backpack'} slot ${index + 1}, ${item || 'empty'}`);
        button.title = item || `Empty ${zone} slot`;
      });
      $('bagCount').textContent = `${inventory.backpack.filter(Boolean).length}/${BACKPACK_SIZE}`;
      $('deleteToggle').setAttribute('aria-pressed', String(deleteActive));
      $('deleteToggle').innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-delete"/></svg>${deleteActive ? '<span class="tool-label">Delete</span>' : ''}`;
      const placing = selectedHotbar !== null && !!inventory.hotbar[selectedHotbar];
      document.body.classList.toggle('has-place-tool', placing);
      document.body.classList.toggle('delete-active', deleteActive);
      $('factoryGrid').querySelectorAll('.grid-cell').forEach(cell => { cell.tabIndex = placing || deleteActive ? 0 : -1; });
    }
    function nextFreeSlot() {
      for (const zone of ['hotbar', 'backpack']) {
        const index = inventory[zone].indexOf(null);
        if (index !== -1) return { zone, index };
      }
      return null;
    }
    function purchase(item) {
      const location = nextFreeSlot();
      if (!location) { showToast('Inventory full'); return; }
      inventory[location.zone][location.index] = item;
      const oldPrice = prices[item];
      if (item === 'Dropper') prices[item] = oldPrice === 0n ? 1n : (oldPrice * 2n > MAX_PRICE ? MAX_PRICE : oldPrice * 2n);
      if (item === 'Conveyor') prices[item] = 50n;
      if (item === 'Extractor') prices[item] = oldPrice === 0n ? 50n : (oldPrice * 3n > MAX_PRICE ? MAX_PRICE : oldPrice * 3n);
      $(`${item.toLowerCase()}Price`).textContent = formatPrice(prices[item]);
      renderInventory();
      showToast('Bought ' + item);
    }
    $('buyDropper').addEventListener('click', () => purchase('Dropper'));
    $('buyConveyor').addEventListener('click', () => purchase('Conveyor'));
    $('buyExtractor').addEventListener('click', () => purchase('Extractor'));

    function sameLocation(a, b) { return !!a && !!b && a.zone === b.zone && a.index === b.index; }
    function moveOrSwap(from, to) {
      if (!from || !to || sameLocation(from, to) || !inventory[from.zone][from.index]) return;
      const oldDestination = inventory[to.zone][to.index];
      inventory[to.zone][to.index] = inventory[from.zone][from.index];
      inventory[from.zone][from.index] = oldDestination;
      selected = null;
      renderInventory();
    }
    function tapSlot(location) {
      if (!$('backpackLayer').classList.contains('is-open')) {
        if (location.zone !== 'hotbar') return;
        selected = null;
        deleteActive = false;
        selectedHotbar = selectedHotbar !== location.index && inventory.hotbar[location.index] ? location.index : null;
        renderInventory();
        return;
      }
      // While the backpack is open, tapping two slots moves or swaps their items.
      if (selected) {
        if (sameLocation(selected, location)) { selected = null; renderInventory(); return; }
        moveOrSwap(selected, location);
        return;
      }
      if (inventory[location.zone][location.index]) {
        selected = location;
        renderInventory();
      }
    }
    $('deleteToggle').addEventListener('click', () => {
      if ($('backpackLayer').classList.contains('is-open')) setBackpack(false, false);
      deleteActive = !deleteActive;
      selectedHotbar = null;
      selected = null;
      renderInventory();
    });
    function locationAt(x, y) {
      const node = document.elementFromPoint(x, y)?.closest('.storage-slot');
      return node ? { zone: node.dataset.zone, index: Number(node.dataset.index), node } : null;
    }
    function gridAt(x, y) {
      const node = document.elementFromPoint(x, y)?.closest('.grid-cell');
      return node ? Number(node.dataset.cell) : null;
    }
    function clearDragStyles() {
      document.body.classList.remove('dragging-to-grid');
      document.querySelectorAll('.drag-over, .drag-origin, .place-over').forEach(el => el.classList.remove('drag-over', 'drag-origin', 'place-over'));
      document.querySelector('.drag-ghost')?.remove();
    }
    function startPointer(event) {
      if (event.button !== 0 && event.pointerType === 'mouse') return;
      const location = { zone: event.currentTarget.dataset.zone, index: Number(event.currentTarget.dataset.index) };
      const item = inventory[location.zone][location.index];
      if (!item) return;
      dragging = { id: event.pointerId, from: location, item, startX: event.clientX, startY: event.clientY, active: false };
      event.currentTarget.setPointerCapture?.(event.pointerId);
    }
    function pointerMoved(event) {
      if (!dragging || dragging.id !== event.pointerId) return;
      const dx = event.clientX - dragging.startX;
      const dy = event.clientY - dragging.startY;
      if (!dragging.active && Math.hypot(dx, dy) <= 8) return;
      if (!dragging.active) {
        dragging.active = true;
        selected = null;
        if (dragging.from.zone === 'hotbar' && !$('backpackLayer').classList.contains('is-open')) document.body.classList.add('dragging-to-grid');
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.innerHTML = iconFor(dragging.item);
        document.body.appendChild(ghost);
        document.querySelector(`.storage-slot[data-zone="${dragging.from.zone}"][data-index="${dragging.from.index}"]`)?.classList.add('drag-origin');
      }
      const ghost = document.querySelector('.drag-ghost');
      if (ghost) { ghost.style.left = event.clientX + 'px'; ghost.style.top = event.clientY + 'px'; }
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      const target = locationAt(event.clientX, event.clientY);
      if (target && !sameLocation(dragging.from, target)) target.node.classList.add('drag-over');
      else if (dragging.from.zone === 'hotbar') {
        const cellIndex = gridAt(event.clientX, event.clientY);
        if (cellIndex !== null && !placed.has(cellKey(cellIndex))) $('factoryGrid').children[cellIndex].classList.add('place-over');
      }
    }
    function pointerEnded(event) {
      if (!dragging || dragging.id !== event.pointerId) return;
      const current = dragging;
      dragging = null;
      const target = current.active ? locationAt(event.clientX, event.clientY) : null;
      const cellIndex = current.active && current.from.zone === 'hotbar' ? gridAt(event.clientX, event.clientY) : null;
      clearDragStyles();
      if (current.active) {
        if (target) moveOrSwap(current.from, target);
        else if (cellIndex !== null) placeFromHotbar(cellIndex, current.from.index);
        else renderInventory();
      } else {
        tapSlot(current.from);
      }
    }
    function pointerCancelled(event) {
      if (!dragging || dragging.id !== event.pointerId) return;
      dragging = null;
      clearDragStyles();
      renderInventory();
    }
    document.addEventListener('pointermove', pointerMoved);
    document.addEventListener('pointerup', pointerEnded);
    document.addEventListener('pointercancel', pointerCancelled);

    function setShop(open) {
      if (open && $('backpackLayer').classList.contains('is-open')) setBackpack(false, false);
      $('shopLayer').classList.toggle('is-open', open);
      $('shopLayer').setAttribute('aria-hidden', String(!open));
      $('shopToggle').setAttribute('aria-expanded', String(open));
      document.body.classList.toggle('shop-open', open);
      if (open) $('closeShop').focus();
      else $('shopToggle').focus();
      // No game pause; the dimmed/blurred background remains live.
    }
    function setBackpack(open, restoreFocus = true) {
      if (open && $('shopLayer').classList.contains('is-open')) setShop(false);
      $('backpackLayer').classList.toggle('is-open', open);
      $('backpackLayer').setAttribute('aria-hidden', String(!open));
      bagToggle.setAttribute('aria-expanded', String(open));
      document.body.classList.toggle('bag-open', open);
      selected = null;
      selectedHotbar = null;
      deleteActive = false;
      renderInventory();
      if (open) $('closeBackpack').focus();
      else if (restoreFocus) bagToggle.focus();
    }
    $('shopToggle').addEventListener('click', () => setShop(true));
    $('closeShop').addEventListener('click', () => setShop(false));
    $('shopScrim').addEventListener('click', () => setShop(false));
    bagToggle.addEventListener('click', () => setBackpack(!$('backpackLayer').classList.contains('is-open')));
    $('closeBackpack').addEventListener('click', () => setBackpack(false));
    $('backpackScrim').addEventListener('click', () => setBackpack(false));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if ($('backpackLayer').classList.contains('is-open')) setBackpack(false);
        else if ($('shopLayer').classList.contains('is-open')) setShop(false);
      }
    });

    updateMoney();
    renderInventory();
    fitFactoryGrid();
  </script>
</body>
</html>
