name: Tiny Factory compatibility and regression tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: Machine, power, pricing, saves and controller logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free game regression suite
        run: node tests/machine-regression.cjs

  browser:
    name: Desktop, phone, iPad and controller browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run five browser profiles
        run: node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machine-madness-cross-platform-screenshots
          path: test-results/screenshots/*.png
          if-no-files-found: ignore
